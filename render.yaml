# Render Blueprint — React + Vite single-page app deployed as a static site.
services:
  - type: web
    name: karate-atlanta-milton
    runtime: static
    branch: claude/friendly-davinci-qt8mcl
    buildCommand: npm install && npm run build
    staticPublishPath: dist     # Vite build output
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    routes:
      # Single-page app: send all unknown paths to index.html so client routing works.
      - type: rewrite
        source: /*
        destination: /index.html
